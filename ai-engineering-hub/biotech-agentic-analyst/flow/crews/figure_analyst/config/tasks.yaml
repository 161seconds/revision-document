figure_analysis:
  agent: figure_analyst
  description: |
    You will receive a list of figures extracted from a scientific paper via Mistral
    OCR 4's Document AI pipeline. Each figure entry contains: figure_id, page_number,
    chart_type (as detected by OCR), title, x_axis, y_axis, data_summary, conditions,
    caption, and optionally an image_path holding the figure image as a data URI
    (data:image/...;base64,...).

    For EACH figure, if an image_path is present, you MUST call the "Add image to
    content" tool with that exact image_path value as the image_url argument to
    visually inspect the chart before extracting intelligence — this gives you ground
    truth that text alone cannot. Never guess is_quantitative_chart or
    passes_sanity_check from the caption/chart_type text alone when an image_path is
    available.

    For EACH figure in the list, produce a FigureIntelligence object containing:
    - figure_id: copy exactly from input
    - chart_type: refine to the most precise descriptor (dose-response, survival curve,
      bar chart, scatter plot, Western blot, heatmap, etc.) — use the image where available
    - key_finding: one declarative sentence summarizing the single most important result,
      including direction and magnitude of any effect
      (e.g. 'Semaglutide 2.4 mg produced 14.9% mean weight loss vs 2.4% placebo at 68 weeks, p<0.001')
    - variables_compared: list all independent variables or comparison groups explicitly shown
    - quantitative_highlights: list all numerical result, p-value, fold-change, or percentage
      explicitly readable from the figure or caption — minimum 2 items per figure; 
      if none are present, return an empty list
    - biological_significance: 2-3 sentences on why this finding matters scientifically or
      clinically, referencing the mechanism or implication
    - knowledge_base_tags: 4-8 short tags for knowledge base indexing — include drug names,
      target names, assay types, disease areas, and statistical methods used
    - is_quantitative_chart: true only if the image is a statistical/data chart — bar chart,
      line chart, scatter plot, pie chart, box plot, histogram, heatmap, dose-response curve,
      survival curve, forest plot, or similar. Set false for micrographs, Western blot gel
      images, histology/microscopy photographs, illustrations, or any image that is not
      itself a plotted chart of data — even if the caption discusses quantitative results.
    - passes_sanity_check: true only if BOTH hold: (1) the image is clear and legible enough
      that you can actually read its axes, labels, and data points — not blurry, cropped,
      low-res, or corrupted; AND (2) what you see in the image is consistent with the
      caption and data_summary text — the chart type, axes, and reported values must match
      what's actually depicted. Set false if either check fails. If no image_path is
      present for a figure, you have no way to verify it — set passes_sanity_check to
      false for that figure regardless of how plausible the text looks.
    - rejection_reason: if is_quantitative_chart or passes_sanity_check is false, a short
      one-sentence explanation of which check failed and why. Otherwise null.

    Return ALL figures as a FigureIntelligenceList with a 'figures' list field.
    Do not skip any figure — figures that fail the checks above must still be returned,
    with is_quantitative_chart / passes_sanity_check set accordingly, so they can be
    filtered out downstream. Do not add commentary outside the schema.

    Input figures: {figures}
  expected_output: |
    A FigureIntelligenceList Pydantic object containing one FigureIntelligence entry
    per input figure, with all required fields populated — including is_quantitative_chart,
    passes_sanity_check, and rejection_reason. No figures skipped.
