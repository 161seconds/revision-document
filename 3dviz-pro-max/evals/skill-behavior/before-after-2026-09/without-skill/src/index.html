<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Emberhollow — a lantern-lit paper village</title>
<style>
  :root {
    --ink: #f3e6d0;
    --ink-dim: #b9a68d;
    --plum: #2a1b3d;
    --plum-2: #150d21;
    --ember: #ffb35c;
    --jade: #6fe0c0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0714; }
  body { font: 13px/1.5 "Avenir Next", "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  canvas { display: block; }
  #app { position: fixed; inset: 0; }

  .panel {
    position: absolute;
    background: linear-gradient(160deg, rgba(42,27,61,.92), rgba(21,13,33,.92));
    border: 1px solid rgba(255,179,92,.28);
    border-radius: 14px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(9px);
    padding: 14px 16px;
  }

  #title { top: 18px; left: 18px; max-width: 320px; }
  #title h1 { margin: 0; font-size: 19px; letter-spacing: .1em; text-transform: uppercase; color: var(--ember); }
  #title .sub { margin: 4px 0 10px; color: var(--ink-dim); font-style: italic; font-size: 12px; }
  #title kbd {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16);
    border-radius: 5px; padding: 0 5px; font-size: 11px; font-family: inherit;
  }
  #title ul { margin: 0; padding-left: 16px; color: var(--ink-dim); font-size: 12px; }

  #dossier { top: 18px; right: 18px; width: 268px; }
  #dossier h2 { margin: 0 0 2px; font-size: 15px; color: var(--jade); letter-spacing: .04em; }
  #dossier .kind { color: var(--ember); font-size: 11px; text-transform: uppercase; letter-spacing: .16em; margin-bottom: 8px; }
  #dossier p { margin: 0 0 10px; color: var(--ink-dim); font-size: 12px; }
  #dossier .stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 11px; color: var(--ink-dim); border-top: 1px dashed rgba(255,179,92,.25); padding-top: 8px; }
  #dossier .stats b { color: var(--ink); font-weight: 500; }

  #roster { bottom: 18px; left: 18px; right: 18px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  #roster .label { color: var(--ink-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .18em; margin-right: 4px; }
  button.chip, button.action {
    font: inherit; font-size: 12px; color: var(--ink); cursor: pointer;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px; padding: 5px 12px; transition: all .16s ease;
  }
  button.chip:hover, button.action:hover { background: rgba(255,179,92,.22); border-color: var(--ember); transform: translateY(-1px); }
  button.chip[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: #2a1b3d; font-weight: 600; }
  button.action { margin-left: auto; background: rgba(111,224,192,.14); border-color: rgba(111,224,192,.5); }
  button.action:hover { background: var(--jade); color: #10261f; }

  #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #0b0714; color: var(--ember); letter-spacing: .3em; text-transform: uppercase; font-size: 12px; transition: opacity .6s ease; }
  #loading.hidden { opacity: 0; pointer-events: none; }
  @media (max-width: 720px) { #title, #dossier { position: static; } #dossier { display: none; } }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="title" class="panel">
    <h1>Emberhollow</h1>
    <div class="sub">Lantern-lit paper village, cut at dusk</div>
    <ul>
      <li>Drag to orbit &middot; scroll to zoom</li>
      <li>Click a building to inspect it</li>
      <li><kbd>R</kbd> resets the camera</li>
    </ul>
  </div>

  <div id="dossier" class="panel">
    <h2 id="d-name">Emberhollow</h2>
    <div class="kind" id="d-kind">Village survey</div>
    <p id="d-desc">Nothing selected. Click any structure in the hollow, or pick one from the roster below.</p>
    <div class="stats" id="d-stats"></div>
  </div>

  <div id="roster" class="panel">
    <span class="label">Roster</span>
    <span id="chips" style="display:contents"></span>
    <button class="action" id="reset-cam" title="Press R">Reset camera</button>
  </div>

  <div id="loading">Folding the hollow&hellip;</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
