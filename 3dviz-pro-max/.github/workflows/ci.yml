name: Validate and package
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: '10.30.1'
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: examples
      - run: pnpm test
        working-directory: examples
      - run: pnpm build
        working-directory: examples
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm build
        working-directory: site
      - run: pnpm test
        working-directory: site
      - run: node scripts/check-budgets.mjs
        working-directory: site
      - run: python3 scripts/validate.py
      - run: python3 scripts/build-index.py --check
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/check-retrieval.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/package.py
      # npm, not pnpm: pnpm skips the package's postinstall, which fetches the native binary.
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .claude-plugin/plugin.json && claude plugin validate --strict .
