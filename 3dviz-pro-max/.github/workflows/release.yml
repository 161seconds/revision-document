name: Draft release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check tag and release readiness
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('.codex-plugin/plugin.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag/version mismatch'
          assert Path('LICENSE').is_file(), 'Choose and add the project license before release'
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: '10.30.1'
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: examples
      - run: pnpm test
        working-directory: examples
      - run: pnpm build
        working-directory: examples
      - run: python3 scripts/validate.py
      - run: python3 scripts/build-index.py --check
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/check-retrieval.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/package.py
      - name: Create draft with validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "$RELEASE_TAG" --notes-file CHANGELOG.md
