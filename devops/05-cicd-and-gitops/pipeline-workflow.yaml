name: Production CI/CD & DevSecOps Pipeline

# ============================================================================
# WORKFLOW TRIGGERS & CONCURRENCY CONTROLS
# ============================================================================
on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

# Tự động hủy lượt chạy cũ khi có commit mới đè lên cùng PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Thiết lập đặc quyền tối thiểu (Least Privilege Principle)
permissions:
  contents: read
  packages: write
  security-events: write

# ============================================================================
# STAGE 1: AUTOMATED TESTING ACROSS MATRIX
# ============================================================================
jobs:
  test-matrix:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Linter Audit
        run: npm run lint --if-present

      - name: Run Unit & Integration Tests
        run: npm test --if-present

# ============================================================================
# STAGE 2: BUILD, SCAN & PUBLISH CONTAINER (DevSecOps)
# ============================================================================
  build-and-security-audit:
    name: Build, Scan & Push Container
    needs: [ test-matrix ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Immutable Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Local Image for Vulnerability Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ github.repository }}:scan-target
          cache-from: type=gha

      # Cổng kiểm soát an ninh: Chặn đứng nếu có lỗ hổng CRITICAL hoặc HIGH
      - name: Run Trivy Vulnerability Security Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.repository }}:scan-target
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Verified Container Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ============================================================================
# STAGE 3: GITOPS DEPLOYMENT RECONCILIATION
# ============================================================================
  gitops-sync:
    name: GitOps Deployment Trigger
    needs: [ build-and-security-audit ]
    runs-on: ubuntu-latest

    steps:
      - name: Notify ArgoCD GitOps Repository
        run: |
          echo "[GITOPS] Publishing deployment update to ArgoCD control repository..."
          echo "[GITOPS] Image ready for reconciliation: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
