name: revision-doc-concurrency
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: revision_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d revision_lab"]
      interval: 1s
      timeout: 3s
      retries: 30
