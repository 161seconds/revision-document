<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flat Type Hierarchy: weight separates the roles</title>
  <style>
    /* A dense listing page (otto.de): headings at 14-16px over 14px body
       text, every heading bold over regular body text. The ramp is flat, and
       weight separates the roles, so the finding reports as advisory: visible,
       outside the failure count. flat-type-hierarchy-weight-flat.html is the
       same ramp with headings at 500, which weight does not separate. */
    body { margin: 0; padding: 24px; background: #ffffff; color: #172033; font-family: Palatino, Georgia, serif; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; max-width: 1120px; margin: 0 auto; }
    h1, h2, h3 { font-weight: 700; margin: 0 0 8px; }
    h1 { font-size: 16px; }
    h2 { font-size: 16px; }
    h3 { font-size: 14px; }
    p, li { font-size: 14px; font-weight: 400; margin: 0 0 8px; }
  </style>
</head>
<body>
  <main>
    <section aria-label="Listing">
      <h1 data-expect="flag" data-case="Flag Bold Listing Title">Running shoes</h1>
      <h2>Filters</h2>
      <ul>
        <li>Brand</li>
        <li>Size</li>
        <li>Colour</li>
        <li>Price</li>
      </ul>
      <h3>Men's trail runner</h3>
      <p>Grippy outsole, 290 g.</p>
      <h3>Women's road shoe</h3>
      <p>Light foam midsole, 240 g.</p>
    </section>
    <section aria-label="Service">
      <h2>Delivery</h2>
      <p>Free delivery from 29 euros.</p>
      <p>Returns within 30 days.</p>
      <h3>Customer service</h3>
      <p>Open every day until 22:00.</p>
      <p>Chat or call.</p>
    </section>
  </main>
</body>
</html>
