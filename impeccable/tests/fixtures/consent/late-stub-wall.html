<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consent hiding: a wall that fills an empty root after load</title>
  <style>
    /* An empty page with Usercentrics' root already in the DOM, empty, at
       load: the first hide pass hides it. The dialog renders into its shadow
       root on the first scroll. The late wall check reads the page with the hide rules
       off, so the wall is refused. Pinned by
       crates/browser/tests/consent_hiding.rs. */
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; min-height: 3000px; background: #f3f4f6; }
  </style>
</head>
<body>
  <div id="usercentrics-root"></div>
  <script>
    window.addEventListener('scroll', () => {
      const root = document.getElementById('usercentrics-root');
      if (root.shadowRoot) return;
      root.attachShadow({ mode: 'open' }).innerHTML =
        '<style>.box { position: fixed; top: 80px; left: 50%; width: 640px; margin-left: -320px; padding: 32px; background: #fff; }</style>'
        + '<div class="box" role="dialog" aria-label="Privacy settings"><h2>Privacy settings</h2>'
        + '<p>We use cookies and similar technologies to provide this website, to measure how it is used and to show you personalised content and advertising. You can accept all of these purposes, reject them, or choose which ones you allow in the settings.</p>'
        + '<button type="button">Accept all</button> <button type="button">Deny</button></div>';
    }, { passive: true });
  </script>
</body>
</html>
